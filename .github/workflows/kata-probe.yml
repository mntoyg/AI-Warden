# TEMPORARY - measures Kata Containers under AI Warden on a GitHub runner.
# Session 13: lives only on claude/cool-knuth-mh33o8 while measuring; removed before merge.
name: kata-probe
on:
  push:
    branches: [claude/cool-knuth-mh33o8]
  workflow_dispatch:

jobs:
  probes:
    runs-on: ubuntu-latest
    timeout-minutes: 60
    steps:
      - uses: actions/checkout@v5

      - name: KVM present
        run: |
          ls -l /dev/kvm
          sudo chmod 666 /dev/kvm
          uname -r

      - name: Install Kata (static release) and register it with Docker
        run: |
          set -e
          url="$(curl -fsSL --retry 5 https://api.github.com/repos/kata-containers/kata-containers/releases/latest \
            | python3 -c 'import json,sys; r=json.load(sys.stdin); print(r["tag_name"], file=sys.stderr); print([a["browser_download_url"] for a in r["assets"] if a["name"].startswith("kata-static-") and "amd64" in a["name"] and a["name"].endswith((".tar.zst",".tar.xz"))][0])')"
          echo "asset: $url"
          curl -fsSL --retry 5 -o /tmp/kata.tar "$url"
          case "$url" in
            *.zst) sudo tar --zstd -xf /tmp/kata.tar -C / ;;
            *.xz)  sudo tar -xJf /tmp/kata.tar -C / ;;
          esac
          find /opt/kata -name 'containerd-shim-kata*' -o -name 'configuration*.toml' | sort
          shim="$(find /opt/kata -type f -name 'containerd-shim-kata-v2' | head -1)"
          test -n "$shim" && test -x "$shim"
          sudo ln -sf "$shim" /usr/local/bin/containerd-shim-kata-v2
          echo "shim: $shim"
          sudo python3 - <<'EOF'
          import json, os
          p = "/etc/docker/daemon.json"
          d = json.load(open(p)) if os.path.exists(p) else {}
          d.setdefault("runtimes", {})["kata"] = {"runtimeType": "io.containerd.kata.v2"}
          json.dump(d, open(p, "w"), indent=2)
          print(json.dumps(d))
          EOF
          sudo systemctl restart docker
          docker info --format '{{range $k,$v := .Runtimes}}{{$k}} {{end}}'
          docker --version

      - name: P0 kata must really be what runs (guest kernel differs from host)
        continue-on-error: true
        run: |
          echo "host kernel : $(uname -r)"
          echo "guest kernel: $(docker run --rm --runtime kata alpine uname -r)"
          docker run --rm --runtime kata alpine sh -c 'cat /proc/cpuinfo | grep -m1 "model name"; grep -c ^processor /proc/cpuinfo; free -m | head -2'

      - name: Probe image (built with runc)
        run: |
          printf 'FROM alpine:3.20\nRUN apk add --no-cache inotify-tools python3 procps\n' > /tmp/Dockerfile.probe
          docker build -q -t kprobe -f /tmp/Dockerfile.probe /tmp

      - name: P1 Docker DNS on a user network
        continue-on-error: true
        run: |
          docker network create pn >/dev/null
          docker run -d --rm --name target --network pn alpine sleep 120 >/dev/null
          echo "runc: $(docker run --rm --network pn alpine getent hosts target || echo NONE)"
          echo "kata: $(docker run --rm --runtime kata --network pn alpine getent hosts target || echo NONE)"
          echo "kata resolv.conf:"; docker run --rm --runtime kata --network pn alpine cat /etc/resolv.conf
          ip="$(docker inspect -f '{{(index .NetworkSettings.Networks "pn").IPAddress}}' target)"
          echo "kata ping by IP ${ip}: $(docker run --rm --runtime kata --network pn alpine ping -c1 -W2 "$ip" >/dev/null 2>&1 && echo OK || echo FAIL)"
          echo "kata --add-host: $(docker run --rm --runtime kata --network pn --add-host "target:${ip}" alpine getent hosts target || echo NONE)"
          docker rm -f target >/dev/null

      - name: P2 --pid container:<kata agent> (what the sentinel relies on)
        continue-on-error: true
        run: |
          docker run -d --name agent --runtime kata kprobe sleep 300 >/dev/null
          sleep 2
          echo "--- kata sidecar --pid container:agent (rc below)"
          docker run --rm --runtime kata --pid container:agent kprobe ps -eo pid,args; echo "rc=$?"
          echo "--- runc sidecar --pid container:agent"
          docker run --rm --pid container:agent kprobe ps -eo pid,args; echo "rc=$?"
          echo "--- kata sidecar: kill -0 1"
          docker run --rm --runtime kata --pid container:agent kprobe sh -c 'kill -0 1 && echo can-signal-1 || echo cannot-signal-1; cat /proc/1/cmdline | tr "\0" " "; echo'
          echo "agent state: $(docker inspect -f '{{.State.Status}} exit={{.State.ExitCode}}' agent)"
          docker rm -f agent >/dev/null

      - name: P3 inotify across containers on a shared named volume
        continue-on-error: true
        run: |
          for pair in "kata kata" "runc kata" "kata runc"; do
            set -- $pair; w=$1; r=$2
            wrt=(); [ "$w" = kata ] && wrt=(--runtime kata)
            rrt=(); [ "$r" = kata ] && rrt=(--runtime kata)
            docker volume create vv >/dev/null
            docker run --rm -v vv:/v alpine sh -c 'echo secret > /v/canary'
            docker run -d --name watcher "${wrt[@]}" -v vv:/v kprobe inotifywait -m -e open,access /v/canary >/dev/null
            sleep 4
            docker run --rm "${rrt[@]}" -v vv:/v alpine cat /v/canary >/dev/null
            sleep 3
            docker run --rm "${rrt[@]}" -v vv:/v alpine sh -c 'cat /v/canary >/dev/null'
            sleep 2
            echo "watcher=${w} reader=${r}: events=$(docker logs watcher 2>&1 | grep -c 'canary')"
            docker logs watcher 2>&1 | tail -4
            docker rm -f watcher >/dev/null; docker volume rm vv >/dev/null
          done
          echo "--- positive control: watcher and reader in the SAME kata container"
          docker run --rm --runtime kata kprobe sh -c 'echo x > /tmp/c; (inotifywait -m -e open /tmp/c > /tmp/ev 2>&1 &); sleep 2; cat /tmp/c >/dev/null; sleep 1; echo "events=$(grep -c OPEN /tmp/ev)"'

      - name: P4 --pids-limit and RLIMIT_NPROC under kata (one clean container each)
        continue-on-error: true
        run: |
          cat > /tmp/fork.py <<'EOF'
          import os, sys, time
          kids = []
          n = 0
          try:
              for i in range(700):
                  pid = os.fork()
                  if pid == 0:
                      time.sleep(30); os._exit(0)
                  kids.append(pid); n += 1
              print("no limit hit, forked", n, flush=True)
          except OSError as e:
              print("forked", n, "then: errno", e.errno, flush=True)
          for k in kids:
              try: os.kill(k, 9)
              except Exception: pass
          print("python rc=0", flush=True)
          EOF
          for cfg in "--pids-limit 512" "--pids-limit 4096 --ulimit nproc=512:512"; do
            name="fk$RANDOM"
            docker run --name "$name" --runtime kata $cfg -v /tmp/fork.py:/f.py:ro -u 1001 kprobe python3 /f.py > /tmp/fk.log 2>&1
            echo "[$cfg] $(paste -sd ' ' /tmp/fk.log) | $(docker inspect -f 'exit={{.State.ExitCode}} oom={{.State.OOMKilled}}' "$name")"
            docker rm -f "$name" >/dev/null
          done

  suite:
    runs-on: ubuntu-latest
    timeout-minutes: 75
    steps:
      - uses: actions/checkout@v5

      - name: KVM present
        run: |
          ls -l /dev/kvm
          sudo chmod 666 /dev/kvm
          uname -r

      - name: Install Kata (static release) and register it with Docker
        run: |
          set -e
          url="$(curl -fsSL --retry 5 https://api.github.com/repos/kata-containers/kata-containers/releases/latest \
            | python3 -c 'import json,sys; r=json.load(sys.stdin); print(r["tag_name"], file=sys.stderr); print([a["browser_download_url"] for a in r["assets"] if a["name"].startswith("kata-static-") and "amd64" in a["name"] and a["name"].endswith((".tar.zst",".tar.xz"))][0])')"
          echo "asset: $url"
          curl -fsSL --retry 5 -o /tmp/kata.tar "$url"
          case "$url" in
            *.zst) sudo tar --zstd -xf /tmp/kata.tar -C / ;;
            *.xz)  sudo tar -xJf /tmp/kata.tar -C / ;;
          esac
          find /opt/kata -name 'containerd-shim-kata*' -o -name 'configuration*.toml' | sort
          shim="$(find /opt/kata -type f -name 'containerd-shim-kata-v2' | head -1)"
          test -n "$shim" && test -x "$shim"
          sudo ln -sf "$shim" /usr/local/bin/containerd-shim-kata-v2
          echo "shim: $shim"
          sudo python3 - <<'EOF'
          import json, os
          p = "/etc/docker/daemon.json"
          d = json.load(open(p)) if os.path.exists(p) else {}
          d.setdefault("runtimes", {})["kata"] = {"runtimeType": "io.containerd.kata.v2"}
          json.dump(d, open(p, "w"), indent=2)
          print(json.dumps(d))
          EOF
          sudo systemctl restart docker
          docker info --format '{{range $k,$v := .Runtimes}}{{$k}} {{end}}'
          docker --version

      - name: Build both images
        run: ./scripts/warden-cli.sh build --pull >/tmp/build.log 2>&1 || { tail -40 /tmp/build.log; exit 1; }

      - name: Suite under kata with a watchdog (stops after 40 min)
        continue-on-error: true
        run: |
          cat > /tmp/wd.sh <<'EOF'
          #!/usr/bin/env bash
          # Every 60 s: what runs on the host, and inside each warden container.
          while :; do
            {
              echo "===== snapshot $(date -u +%H:%M:%S)"
              docker ps --format '{{.Names}} {{.Status}} {{.Image}}'
              ps -eo pid,etimes,stat,args --forest | grep -E 'verify-isolation|warden-cli|docker (run|exec|wait|logs|rm|stop)|timeout' | grep -v grep | cut -c1-220 | tail -25
              for c in $(docker ps --format '{{.Names}}' | grep -E '^warden-|-sentinel$|-model$'); do
                echo "--- in ${c}:"
                timeout 10 docker exec "$c" ps -eo pid,etimes,stat,args 2>&1 | cut -c1-200 | tail -12
                echo "--- logs ${c}:"
                timeout 10 docker logs --tail 8 "$c" 2>&1 | cut -c1-200
              done
            } > /tmp/wd.now 2>&1
            mv /tmp/wd.now /tmp/wd.last
            cat /tmp/wd.last >> /tmp/wd.all
            sleep 60
          done
          EOF
          chmod +x /tmp/wd.sh
          /tmp/wd.sh &
          wd=$!
          start=$(date +%s)
          rc=0
          WARDEN_RUNTIME=kata NO_COLOR=1 timeout 2400 ./scripts/verify-isolation.sh > /tmp/suite.log 2>&1 || rc=$?
          kill "$wd" 2>/dev/null || true
          echo "suite rc=${rc} after $(( $(date +%s) - start )) s" | tee /tmp/suite.rc

      - name: Report (kept last so the log tail holds it)
        if: always()
        run: |
          echo "##### PASS/FAIL/SKIP lines"
          grep -E '^  (PASS|FAIL|SKIP)|PHASE [A-L]' /tmp/suite.log | cut -c1-200 | tail -70 || true
          echo "##### suite tail"
          tail -25 /tmp/suite.log | cut -c1-220 || true
          cat /tmp/suite.rc 2>/dev/null || true
          echo "##### last watchdog snapshot"
          cat /tmp/wd.last 2>/dev/null || true
