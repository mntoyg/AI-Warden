# =============================================================================
#  AI Warden - CI
# -----------------------------------------------------------------------------
#  The integration job is the point of this file. AI Warden's failure mode is a
#  control that reports itself armed while enforcing nothing, and every serious
#  bug in this project so far has been of exactly that shape - a tripwire
#  watching a filesystem that never delivers events, a sentinel without the
#  capability to kill, a breach that exited 0. Static analysis catches none of
#  those. Only running the drills does.
#
#  CI also runs on real ext4, so it proves the platform claim in the README that
#  a Linux host enforces every canary path (enforced=7/7), which a Docker
#  Desktop developer machine cannot demonstrate.
# =============================================================================

name: CI

on:
  push:
    branches: [main]
    tags: ['v*']
  pull_request:
    branches: [main]
  workflow_dispatch:
  schedule:
    # Weekly, Monday 06:00 UTC. The image builds below run with --pull, so this
    # catches a HIGH/CRITICAL that lands in the Debian base AFTER our last push -
    # without a timer that drift is only ever found by luck during a release
    # (which is exactly how libpcre2 reached v1.0.0 and sat there for 8 days).
    - cron: '0 6 * * 1'

permissions:
  contents: read

jobs:
  # ===========================================================================
  static:
    name: Static analysis
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v5
        with:
          # gitleaks scans history, and the canary's PEM header is
          # allowlisted in .gitleaksignore by commit fingerprint. A shallow
          # checkout collapses history into one synthetic commit with a
          # different SHA, so the fingerprint stops matching and the scan
          # fails on a finding that is already accounted for.
          fetch-depth: 0

      # Docker Hub occasionally resets the connection mid-pull (seen: the gitleaks
      # image, `read: connection reset by peer`, exit 125) and reds an otherwise
      # clean build. Pull the tool images up front with a retry so the analysis
      # steps below hit a warm cache; a genuine outage still fails, but loudly and
      # only after real retries.
      - name: Pre-pull tool images (retry transient Docker Hub errors)
        run: |
          pull() {
            for i in 1 2 3 4 5; do
              docker pull "$1" && return 0
              echo "pull $1 failed (attempt $i/5); retrying in $((i*5))s"
              sleep $((i * 5))
            done
            echo "::error::could not pull $1 after 5 attempts"
            return 1
          }
          pull koalaman/shellcheck:stable
          pull hadolint/hadolint:latest
          pull zricethezav/gitleaks:latest

      - name: shellcheck
        run: |
          docker run --rm -v "$PWD:/mnt" -w /mnt koalaman/shellcheck:stable \
            -S warning \
            scripts/*.sh core/entrypoint.sh core/network/proxy-entrypoint.sh

      - name: hadolint
        run: |
          for f in core/Dockerfile core/network/Dockerfile; do
            echo "--- $f"
            docker run --rm -i hadolint/hadolint hadolint --failure-threshold warning - < "$f"
          done

      - name: Byte-compile the canary monitor
        run: python3 -m py_compile monitors/canary_monitor.py

      - name: Validate the compose topology
        run: docker compose config -q

      - name: The sandbox network must be internal
        # If this ever stops being true the agent gets a route to the internet
        # and the egress allowlist becomes advisory.
        run: |
          docker compose config --format json \
            | python3 -c 'import json,sys; n=json.load(sys.stdin)["networks"]["warden_internal"]; assert n.get("internal") is True, n; print("warden_internal is internal: OK")'

      - name: The egress ruleset must end in a default deny
        run: |
          grep -qE '^[[:space:]]*http_access[[:space:]]+deny[[:space:]]+all[[:space:]]*$' \
            core/network/squid.conf && echo "default-deny present: OK"

      - name: No exfiltration relay may be allowlisted
        run: |
          if grep -vE '^[[:space:]]*(#|$)' core/network/whitelist_domains.txt \
             | grep -Ei 'ngrok|trycloudflare|localtunnel|pastebin|webhook\.site|requestb|hookb|transfer\.sh|file\.io|anonfiles|0x0\.st'; then
            echo "::error::an exfiltration relay is present in the egress allowlist"
            exit 1
          fi
          echo "no known relays in the allowlist: OK"

      - name: Per-tool ignore files must match .aiignore
        # They are mirrors. A drifted mirror means one agent is told not to
        # touch the canaries while another is not.
        run: |
          make sync-ignores
          git diff --exit-code -- '.*ignore' \
            || { echo "::error::ignore mirrors are stale - run 'make sync-ignores'"; exit 1; }

      - name: Host prerequisite check
        run: ./scripts/setup-host.sh --check

      - name: Secret scan (full history)
        # The canary carries a real PEM header on purpose, so that one finding
        # is allowlisted by fingerprint in .gitleaksignore - together with the
        # command to decode it and confirm it is synthetic. Anything else that
        # fires here is a genuine leak.
        run: |
          docker run --rm -v "$PWD:/repo" zricethezav/gitleaks:latest \
            detect --source=/repo --redact --no-banner

  # ===========================================================================
  vulnerabilities:
    name: Image CVE scan
    runs-on: ubuntu-latest
    timeout-minutes: 30
    steps:
      - uses: actions/checkout@v5

      - name: Pre-pull the trivy image (retry transient Docker Hub errors)
        run: |
          for i in 1 2 3 4 5; do
            docker pull aquasec/trivy:latest && exit 0
            echo "pull aquasec/trivy:latest failed (attempt $i/5); retrying in $((i*5))s"
            sleep $((i * 5))
          done
          echo "::error::could not pull aquasec/trivy:latest after 5 attempts"
          exit 1

      - name: Build both images
        run: ./scripts/warden-cli.sh build --pull

      # The gate is deliberately scoped. OS packages, and anything under
      # /opt/warden, are what this project chose and ships - a HIGH or CRITICAL
      # there is ours and fails the build.
      - name: Fail on CVEs in what AI Warden itself ships
        run: |
          set -e
          for img in ai-warden/agent:latest ai-warden/egress-proxy:latest; do
            echo "--- $img (OS packages)"
            docker run --rm -v /var/run/docker.sock:/var/run/docker.sock \
              aquasec/trivy:latest image --scanners vuln --pkg-types os \
              --severity HIGH,CRITICAL --ignore-unfixed --exit-code 1 --quiet "$img"
          done
          echo "--- agent image, warden-owned paths"
          docker run --rm -v /var/run/docker.sock:/var/run/docker.sock \
            aquasec/trivy:latest image --scanners vuln --severity HIGH,CRITICAL \
            --ignore-unfixed --quiet --format json ai-warden/agent:latest > trivy.json
          python3 -c '
          import json, sys
          d = json.load(open("trivy.json"))
          ours = [v for r in d.get("Results", [])
                  for v in (r.get("Vulnerabilities") or [])
                  if "/opt/warden/" in (v.get("PkgPath") or "")]
          for v in ours:
              print("::error::%s in %s (%s)" % (v["VulnerabilityID"], v["PkgName"], v.get("PkgPath")))
          print("warden-owned CVEs:", len(ours))
          sys.exit(1 if ours else 0)'

      # The agent CLIs bring their own dependency trees. A CVE in litellm, or in
      # npm's bundled tar, does not weaken the sandbox: the threat model already
      # assumes arbitrary code execution as uid 1001 inside the container, and
      # containment comes from the capability set, the mount scope and the
      # egress allowlist - none of which those packages can influence. Reported
      # so it stays visible, not gated, because we do not control those trees.
      - name: Report CVEs in the bundled agents (informational)
        if: always()
        run: |
          docker run --rm -v /var/run/docker.sock:/var/run/docker.sock \
            aquasec/trivy:latest image --scanners vuln --severity HIGH,CRITICAL \
            --ignore-unfixed --quiet ai-warden/agent:latest || true

  # ===========================================================================
  integration:
    name: Isolation drills (real ext4)
    runs-on: ubuntu-latest
    timeout-minutes: 45
    steps:
      - uses: actions/checkout@v5

      - name: Build both images
        run: ./scripts/warden-cli.sh build --pull

      - name: Start the egress filter
        run: ./scripts/warden-cli.sh up

      - name: Prove the egress allowlist from inside the sandbox network
        run: |
          set -e
          run_probe() {
            docker run --rm --network warden_internal --entrypoint sh \
              ai-warden/egress-proxy:latest -c "$1"
          }
          echo "--- direct egress must be impossible ---"
          run_probe 'nc -z -w 3 1.1.1.1 443 && exit 1 || echo "  1.1.1.1:443 blocked"'
          run_probe 'nc -z -w 3 8.8.8.8 53  && exit 1 || echo "  8.8.8.8:53 blocked"'
          echo "--- allowlisted destinations must work ---"
          run_probe 'curl -x http://warden-egress-proxy:3128 -sS -o /dev/null -w "  api.anthropic.com HTTP %{http_code}\n" -m 30 https://api.anthropic.com/v1/models'
          echo "--- everything else must be refused ---"
          run_probe 'curl -x http://warden-egress-proxy:3128 -s -o /dev/null -m 20 https://example.com/  && exit 1 || echo "  example.com:443 refused"'
          run_probe 'curl -x http://warden-egress-proxy:3128 -s -o /dev/null -m 20 https://1.1.1.1/      && exit 1 || echo "  IP-literal refused"'
          run_probe 'curl -x http://warden-egress-proxy:3128 -s -o /dev/null -m 20 https://github.com:22/ && exit 1 || echo "  github.com:22 refused"'

      - name: Isolation suite (self-test, breach, fail-closed, sentinel)
        run: NO_COLOR=1 ./scripts/verify-isolation.sh

      - name: Every canary path must be enforceable on Linux
        # The README claims 7/7 on a native Docker host and 4/7 on Docker
        # Desktop. This is where that claim is actually checked.
        run: |
          set -e
          mkdir -p workspaces/ci && chmod 0777 workspaces/ci
          NO_COLOR=1 ./scripts/warden-cli.sh run ./workspaces/ci bash -- -lc 'true' 2>&1 \
            | tee /tmp/warden-run.log || true
          if grep -q 'enforced=7/7' /tmp/warden-run.log; then
            echo "enforced=7/7 on ext4: OK"
          else
            echo "::error::expected enforced=7/7 on a native Linux host"
            grep -E 'enforced=|DEGRADED' /tmp/warden-run.log || true
            exit 1
          fi

      - name: Compose agent profile must come up and hand off cleanly
        run: |
          set -e
          mkdir -p workspaces/ci-compose && chmod 0777 workspaces/ci-compose
          WARDEN_WORKSPACE_HOST=./workspaces/ci-compose \
            timeout 300 docker compose --profile agent up \
              --abort-on-container-exit --exit-code-from warden-agent-sandbox \
            2>&1 | tee /tmp/warden-compose.log || true
          grep -q 'seeding handshake received' /tmp/warden-compose.log \
            || { echo "::error::the sentinel never received the seeding handshake"; exit 1; }
          grep -q 'armed out-of-band' /tmp/warden-compose.log \
            || { echo "::error::the agent started before the sentinel was armed"; exit 1; }
          echo "compose handshake: OK"

      - name: Nothing may be left behind
        if: always()
        run: |
          ./scripts/warden-cli.sh down || true
          docker compose --profile agent down -v || true
          left="$(docker volume ls -q --filter 'label=ai.warden.role=canary-vault' | wc -l)"
          echo "leftover canary vaults: ${left}"
          test "$left" -eq 0

      - name: Egress audit trail
        if: always()
        run: docker logs warden-egress-proxy 2>&1 | tail -40 || true

  # ===========================================================================
  # gVisor is THREAT_MODEL 4.1's answer to a kernel escape, so it has to be run,
  # not only plumbed. A GitHub runner is a real Linux VM and runsc installs from
  # gVisor's own apt repo. What running it found the first time (2026-09-27):
  # Docker's DNS does not answer inside gVisor, so every CLI session failed
  # closed (78) until the CLI pinned the proxy/model names; and `--pid
  # container:` is silently ignored, so the sentinel could see nothing while
  # the sandbox said "armed out-of-band" (it now says NOT armed - phase K).
  gvisor:
    name: gVisor (runsc) drills
    runs-on: ubuntu-latest
    timeout-minutes: 60
    steps:
      - uses: actions/checkout@v5

      - name: Install gVisor (runsc) and register it with Docker
        run: |
          set -e
          curl -fsSL --retry 5 https://gvisor.dev/archive.key \
            | sudo gpg --dearmor -o /usr/share/keyrings/gvisor-archive-keyring.gpg
          echo "deb [arch=$(dpkg --print-architecture) signed-by=/usr/share/keyrings/gvisor-archive-keyring.gpg] https://storage.googleapis.com/gvisor/releases release main" \
            | sudo tee /etc/apt/sources.list.d/gvisor.list >/dev/null
          sudo apt-get update -qq
          sudo apt-get install -y -qq runsc
          sudo runsc install
          sudo systemctl restart docker
          runsc --version

      - name: runsc must really be what runs
        run: |
          docker run --rm --runtime runsc alpine dmesg > /tmp/dmesg.txt
          grep -q 'Starting gVisor' /tmp/dmesg.txt && echo "gVisor kernel answered: OK"

      - name: Build both images
        run: ./scripts/warden-cli.sh build --pull

      - name: Start the egress filter
        run: ./scripts/warden-cli.sh up

      - name: Isolation suite under WARDEN_RUNTIME=runsc
        run: WARDEN_RUNTIME=runsc NO_COLOR=1 ./scripts/verify-isolation.sh

      - name: A real session under runsc reaches the proxy and says the sentinel is NOT armed
        run: |
          set +e   # Actions runs bash -e; the rc and the log are the evidence here
          mkdir -p workspaces/gv && chmod 0777 workspaces/gv
          WARDEN_RUNTIME=runsc NO_COLOR=1 ./scripts/warden-cli.sh run ./workspaces/gv bash -- -lc \
            'curl -sS -o /dev/null -w "proxy path: HTTP %{http_code}\n" -m 30 https://api.anthropic.com/v1/models; dmesg 2>&1 | head -1' \
            > /tmp/gv-ok.log 2>&1
          echo "rc=$?"; cat /tmp/gv-ok.log
          f=0
          grep -q 'proxy path: HTTP [1-5][0-9][0-9]' /tmp/gv-ok.log || { echo "::error::the runsc sandbox did not reach api.anthropic.com through the proxy"; f=1; }
          grep -q 'canary sentinel    : NOT armed' /tmp/gv-ok.log || { echo "::error::the sandbox did not say the sentinel is NOT armed under runsc"; f=1; }
          if grep -q 'armed out-of-band' /tmp/gv-ok.log; then echo "::error::'armed out-of-band' under runsc, where the sentinel cannot see the agent"; f=1; fi
          exit "$f"

      - name: A live breach under runsc is contained by the in-sandbox tripwire (exit 99)
        run: |
          set +e   # a contained breach exits 99 on purpose
          mkdir -p workspaces/gvb && chmod 0777 workspaces/gvb
          WARDEN_RUNTIME=runsc NO_COLOR=1 ./scripts/warden-cli.sh run ./workspaces/gvb bash -- -lc \
            'cat /workspace/.secrets/credentials > /dev/null; sleep 20; echo "[drill] NOT KILLED"' \
            > /tmp/gv-breach.log 2>&1
          rc=$?
          cat /tmp/gv-breach.log
          # -x: the command line itself is echoed in the log ("launching agent: ...")
          if [ "$rc" -ne 99 ] || grep -qx '\[drill\] NOT KILLED' /tmp/gv-breach.log; then
            echo "::error::a canary read under runsc was not contained (rc=${rc})"
            exit 1
          fi
          ls workspaces/gvb/WARDEN_SECURITY_INCIDENT*.json
          echo "breach under runsc: exit 99, report written"

      # Measured 2026-09-27 (python:3.12-alpine, CLI-like flags): runc stops a
      # fork bomb at RLIMIT_NPROC with EAGAIN (511 of 600); under runsc 150
      # forks work and 300 kill the WHOLE sandbox - exit 2, no output, not OOM.
      # The cause is --pids-limit: under runsc it caps gVisor's HOST tasks
      # (without it 400 forks succeed; nofile/nproc are not involved; a CLI run
      # with WARDEN_PIDS_LIMIT=4096 still died - the per-process cost is not
      # measured yet). Either way the bomb must not reach 2000 processes, and
      # the session must end.
      - name: A fork bomb under runsc is bounded
        run: |
          set +e
          mkdir -p workspaces/gvf && chmod 0777 workspaces/gvf
          cat > workspaces/gvf/forks.py <<'PY'
          import os, time
          n = 0
          for i in range(2000):
              try:
                  pid = os.fork()
              except OSError as e:
                  print(f"forked {n}, then: errno {e.errno} {e.strerror}", flush=True)
                  break
              if pid == 0:
                  time.sleep(15)
                  os._exit(0)
              n += 1
          else:
              print(f"forked {n} - no limit hit", flush=True)
          PY
          bomb='python3 /workspace/forks.py; echo "python rc=$?"'
          timeout 300 env WARDEN_RUNTIME=runsc NO_COLOR=1 ./scripts/warden-cli.sh run ./workspaces/gvf bash -- -lc "$bomb" > /tmp/gv-fork.log 2>&1
          rc=$?
          echo "fork bomb under runsc: rc=${rc} $(grep -hE '^forked|^python rc' /tmp/gv-fork.log | paste -sd ' ')"
          if grep -q 'no limit hit' /tmp/gv-fork.log; then echo "::error::2000 forks hit no limit under runsc"; exit 1; fi
          if [ "$rc" -eq 124 ]; then echo "::error::the session did not end within 300 s"; exit 1; fi
          if [ "$rc" -eq 0 ] && ! grep -qE '^forked [0-9]+, then: errno 11' /tmp/gv-fork.log; then
            echo "::error::the session ended cleanly with no evidence of a bound"; exit 1
          fi
          echo "bounded: the bomb did not reach 2000 processes and the session ended"

      - name: Nothing may be left behind
        if: always()
        run: |
          ./scripts/warden-cli.sh down || true
          left="$(docker volume ls -q --filter 'label=ai.warden.role=canary-vault' | wc -l)"
          echo "leftover canary vaults: ${left}"
          test "$left" -eq 0
