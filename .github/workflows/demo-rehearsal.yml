# TEMPORARY (kata-probe branch, reused): why act 3 sometimes ends with no
# incident report on Linux (runs 36368314520 take 2, 36368859278 take 1).
name: demo-rehearsal
on:
  push:
    branches: [kata-probe]
jobs:
  act3-race:
    runs-on: ubuntu-latest
    timeout-minutes: 45
    steps:
      - uses: actions/checkout@v5
      - name: Keep every sentinel log (temp branch only)
        run: |
          python3 - <<'PY'
          p = "scripts/warden-cli.sh"
          s = open(p).read()
          old = '    docker rm -f "${1}-sentinel" >/dev/null 2>&1 || true\n}'
          assert s.count(old) == 1, "stop_sentinel body not found"
          s = s.replace(old, '    docker logs "${1}-sentinel" > "/tmp/sentinel-$(date +%s%N).log" 2>&1 || true\n' + old)
          open(p, "w").write(s)
          PY
          grep -n -A3 '^stop_sentinel()' scripts/warden-cli.sh
      - name: Build both images
        run: ./scripts/warden-cli.sh build --pull > /tmp/build.log 2>&1 || { tail -40 /tmp/build.log; exit 1; }
      - name: Act 3 six times each on a 0755 and a 0777 workspace
        run: |
          ./scripts/warden-cli.sh up > /dev/null
          for mode in 0755 0777; do
            for i in 1 2 3 4 5 6; do
              ws="workspaces/r-$mode-$i"; mkdir -p "$ws"; chmod "$mode" "$ws"
              rm -f /tmp/sentinel-*.log
              rc=0; NO_COLOR=1 ./scripts/warden-cli.sh run "$ws" bash -- -c \
                'exec 3< /workspace/.secrets/credentials; cat <&3 >/dev/null; sleep 25' > /tmp/run.log 2>&1 || rc=$?
              reports="$(ls "$ws" | grep -c INCIDENT || true)"
              inline_wrote="$(grep -c 'SIGKILL delivered' /tmp/run.log || true)"
              s="$(cat /tmp/sentinel-*.log 2>/dev/null)"
              echo "mode=$mode take=$i rc=$rc reports=$reports inline_reached_kill=$inline_wrote forged_msg=$(grep -c 'possibly forged' /tmp/run.log) sentinel: $(printf '%s\n' "$s" | grep -E 'could not|incident report|SIGKILL delivered' | sed 's/^\[canary [^]]*\] //' | paste -sd '|' | cut -c1-230)"
            done
          done
