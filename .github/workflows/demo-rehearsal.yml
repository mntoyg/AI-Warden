# TEMPORARY (kata-probe branch, reused - the cloud session cannot delete
# branches): rehearse the demo from main's v1.2.5 code on a clean runner.
name: demo-rehearsal
on:
  push:
    branches: [kata-probe]
jobs:
  rehearse:
    runs-on: ubuntu-latest
    timeout-minutes: 45
    steps:
      - uses: actions/checkout@v5
      - name: Build both images (as the user's box has them - v1.2.5)
        run: ./scripts/warden-cli.sh build --pull > /tmp/build.log 2>&1 || { tail -40 /tmp/build.log; exit 1; }
      - name: demo.sh --auto (acts 0-3, no agent key on the runner)
        run: |
          rc=0; NO_COLOR=1 bash ./scripts/demo.sh --auto > /tmp/demo.log 2>&1 || rc=$?
          echo "demo rc=${rc}"
          grep -nE 'PASS|FAIL|WARN|Act [0-9]|exit code|Confirmed by the sentinel|Incident report|DEMO COMPLETE|PRE-FLIGHT|enforced=' /tmp/demo.log | cut -c1-200
          grep -q 'DEMO COMPLETE' /tmp/demo.log && [ "$rc" -eq 0 ] || { echo "::error::rehearsal did not complete"; tail -60 /tmp/demo.log; exit 1; }
      - name: Second take right after the first (re-runs must be clean)
        run: |
          rc=0; NO_COLOR=1 bash ./scripts/demo.sh --auto > /tmp/demo2.log 2>&1 || rc=$?
          echo "second take rc=${rc}"; grep -E 'DEMO COMPLETE|FAIL' /tmp/demo2.log | cut -c1-200
          [ "$rc" -eq 0 ] || { tail -40 /tmp/demo2.log; exit 1; }
      - name: status afterwards (nothing left behind)
        run: NO_COLOR=1 ./scripts/warden-cli.sh status 2>&1 | tail -25
