# =============================================================================
#  AI Warden - Egress Filter (Squid explicit forward proxy)
# -----------------------------------------------------------------------------
#  Default policy: DENY ALL.
#  The agent container sits on an `internal` Docker network with no route to
#  the internet. This proxy is dual-homed (internal + external) and is the only
#  path out. Every request is matched against core/network/whitelist_domains.txt
#  and anything else is refused with 403.
#
#  DESIGN NOTE - why no SSL-bump
#  We deliberately do NOT terminate TLS. Bumping would require installing a
#  warden CA inside the sandbox and would expose every API key in cleartext to
#  the proxy process. Instead we filter on the CONNECT target host, which is
#  enough to enforce "who may you talk to" without ever seeing "what you said".
#  The trade-off is documented in docs/THREAT_MODEL.md.
#
#  Validate:  squid -k parse -f /etc/squid/squid.conf
# =============================================================================

# -----------------------------------------------------------------------------
# Listener
# -----------------------------------------------------------------------------
http_port 3128
visible_hostname warden-egress-proxy
pid_filename none

# -----------------------------------------------------------------------------
# Port ACLs - only plain HTTP and HTTPS exist as far as the sandbox is concerned
# -----------------------------------------------------------------------------
acl SSL_ports  port 443
acl Safe_ports port 80
acl Safe_ports port 443
acl CONNECT    method CONNECT

# -----------------------------------------------------------------------------
# Who may use this proxy: only the internal warden network.
# (RFC1918 ranges; Docker allocates the sandbox network from these.)
# -----------------------------------------------------------------------------
acl warden_clients src 10.0.0.0/8
acl warden_clients src 172.16.0.0/12
acl warden_clients src 192.168.0.0/16

# -----------------------------------------------------------------------------
# The allowlist itself
# -----------------------------------------------------------------------------
acl allowed_domains dstdomain "/etc/squid/whitelist_domains.txt"

# -----------------------------------------------------------------------------
# Block IP-literal destinations. An agent must not be able to bypass the
# domain allowlist by connecting straight to an address (or to a DNS-rebound
# host it resolved itself).
# -----------------------------------------------------------------------------
acl numeric_ipv4 dstdom_regex ^([0-9]{1,3}\.){3}[0-9]{1,3}$
acl numeric_ipv6 dstdom_regex ^\[?([0-9a-fA-F]{0,4}:){2,7}[0-9a-fA-F]{0,4}\]?$
acl numeric_dst  dstdom_regex ^[0-9]+$

# -----------------------------------------------------------------------------
# Block RFC1918 / loopback / link-local destinations: no lateral movement into
# the host's LAN, the Docker bridge, or cloud metadata services.
# -----------------------------------------------------------------------------
acl private_dst dst 0.0.0.0/8
acl private_dst dst 10.0.0.0/8
acl private_dst dst 100.64.0.0/10
acl private_dst dst 127.0.0.0/8
acl private_dst dst 169.254.0.0/16
acl private_dst dst 172.16.0.0/12
acl private_dst dst 192.168.0.0/16
acl private_dst dst 198.18.0.0/15
acl private_dst dst 224.0.0.0/4
acl private_dst dst ::1/128
acl private_dst dst fc00::/7
acl private_dst dst fe80::/10

# Cloud instance-metadata endpoints, by name as well as by address.
acl metadata_dst dstdomain metadata.google.internal
acl metadata_dst dstdomain .metadata.internal
acl metadata_dst dstdomain instance-data
acl metadata_dst dstdomain metadata.azure.com

# -----------------------------------------------------------------------------
# ACCESS RULES - order matters, first match wins
# -----------------------------------------------------------------------------
# 1. Squid's own management interface is never reachable from the sandbox.
http_access deny manager

# 2. Nothing outside HTTP(80)/HTTPS(443).
http_access deny !Safe_ports
http_access deny CONNECT !SSL_ports

# 3. No IP-literal or numeric destinations.
http_access deny numeric_ipv4
http_access deny numeric_ipv6
http_access deny numeric_dst

# 4. No private/loopback/link-local/metadata destinations.
http_access deny private_dst
http_access deny metadata_dst

# 5. Only the warden internal network may use the proxy at all.
http_access deny !warden_clients

# 6. The allowlist.
http_access allow warden_clients allowed_domains

# 7. Default: DENY ALL.
http_access deny all

# Same posture for the ICP/HTCP sibling protocols (unused, but closed anyway).
icp_access deny all

# -----------------------------------------------------------------------------
# Caching: disabled. API responses and package tarballs must never be written
# to disk on the proxy, where they would outlive the sandbox.
# -----------------------------------------------------------------------------
cache deny all
cache_mem 16 MB
maximum_object_size_in_memory 0 KB
memory_pools off

# -----------------------------------------------------------------------------
# Anti-exfiltration: cap how much an agent can PUSH out in a single request.
# Raise this if you legitimately push large git objects through the proxy.
# -----------------------------------------------------------------------------
request_body_max_size 64 MB
client_request_buffer_max_size 8 MB

# -----------------------------------------------------------------------------
# Privacy / fingerprint hygiene - the proxy must not leak sandbox internals
# to upstream services.
# -----------------------------------------------------------------------------
via off
forwarded_for delete
httpd_suppress_version_string on
request_header_access X-Forwarded-For deny all
request_header_access Via deny all
reply_header_access Via deny all
reply_header_access X-Cache deny all
reply_header_access X-Cache-Lookup deny all

# -----------------------------------------------------------------------------
# Logging - straight to the container's stdout/stderr so `docker logs` is the
# single audit trail. Every allowed and denied request is recorded.
# -----------------------------------------------------------------------------
logfile_rotate 0
access_log stdio:/dev/stdout squid
cache_log stdio:/dev/stderr
cache_store_log none
# Query strings are stripped from the log: an allowlisted URL may still
# carry a token, and the audit trail must not become a secret store.
strip_query_terms on

# -----------------------------------------------------------------------------
# Resilience / timeouts
# -----------------------------------------------------------------------------
dns_v4_first on
connect_timeout 15 seconds
read_timeout 5 minutes
request_timeout 2 minutes
client_lifetime 8 hours
shutdown_lifetime 5 seconds
half_closed_clients off
max_filedescriptors 4096

# -----------------------------------------------------------------------------
# A denial should be obvious in the agent's terminal, not a mystery timeout.
# -----------------------------------------------------------------------------
deny_info ERR_ACCESS_DENIED all
